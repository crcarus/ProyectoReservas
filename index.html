<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodluck FIT — Agenda tu clase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand-row">
          <div class="clover">🍀</div>
          <div class="brand-name">GOODLUCK FIT</div>
        </div>
        <div class="brand">AGENDA<span>TU</span>CLASE</div>
      </div>
    </header>

    <div id="contenido">
      <div class="loading-state"><div class="spinner"></div> Cargando...</div>
    </div>
  </div>

  <!-- Modal de reserva (contenido 100% dinámico, controlado por app.js) -->
  <div id="modal-reserva" class="modal-backdrop" style="display:none;">
    <div class="modal" id="modal-reserva-inner"></div>
  </div>

  <!-- Modal de cancelación (vía link del email) -->
  <div id="modal-cancelacion" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h3>Cancelar reserva</h3>
      <p>¿Confirmas que deseas cancelar esta reserva? Recuerda que solo se puede cancelar hasta 6 horas antes de la clase.</p>
      <div id="cancel-msg"></div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="secondary" onclick="window.location.href='index.html'">Volver</button>
        <button type="button" class="danger" onclick="confirmarCancelacion(this)">Sí, cancelar</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
