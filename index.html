<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu clase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">RESERVA<span>TU</span>CLASE</div>
      <div class="tag">Reserva tu clase</div>
    </header>

    <div id="contenido">
      <p>Cargando...</p>
    </div>
  </div>

  <!-- Modal de reserva -->
  <div id="modal-reserva" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h3 id="modal-titulo">Reservar clase</h3>
      <p id="modal-detalle" style="margin-bottom:18px;"></p>
      <form id="form-reserva">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="f-nombre" required>
        </div>
        <div class="field">
          <label>Apellido</label>
          <input type="text" id="f-apellido" required>
        </div>
        <div class="field">
          <label>Correo</label>
          <input type="email" id="f-correo" required>
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="tel" id="f-telefono" required>
        </div>
        <div id="form-msg"></div>
        <div style="display:flex; gap:10px;">
          <button type="button" class="secondary" onclick="cerrarModal()">Cancelar</button>
          <button type="submit">Confirmar reserva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de cancelación (vía link del email) -->
  <div id="modal-cancelacion" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h3>Cancelar reserva</h3>
      <p>¿Confirmas que deseas cancelar esta reserva? Recuerda que solo se puede cancelar hasta 6 horas antes de la clase.</p>
      <div id="cancel-msg"></div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="secondary" onclick="window.location.href='index.html'">Volver</button>
        <button type="button" class="danger" onclick="confirmarCancelacion()">Sí, cancelar</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
