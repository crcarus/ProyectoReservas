<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodluck FIT — Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">

    <div id="login-screen" class="admin-login">
      <div class="brand-row" style="justify-content:center;">
        <div class="clover">🍀</div>
        <div class="brand-name">GOODLUCK FIT</div>
      </div>
      <h2 style="margin-bottom:20px;">Panel Admin</h2>
      <div class="field">
        <label>PIN</label>
        <input type="password" id="pin-input" placeholder="••••">
      </div>
      <div id="login-msg"></div>
      <button onclick="hacerLogin()">Ingresar</button>
    </div>

    <div id="admin-screen" style="display:none;">
      <header class="top">
        <div>
          <div class="brand-row">
            <div class="clover">🍀</div>
            <div class="brand-name">GOODLUCK FIT</div>
          </div>
          <div class="brand">PANEL<span>ADMIN</span></div>
        </div>
        <button class="secondary" style="width:auto;" onclick="cerrarSesion()">Salir</button>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="tipos" onclick="cambiarTab('tipos')">Tipos de clase</button>
        <button class="tab-btn" data-tab="horarios" onclick="cambiarTab('horarios')">Horarios</button>
        <button class="tab-btn" data-tab="generar" onclick="cambiarTab('generar')">Generar clases</button>
        <button class="tab-btn" data-tab="reservas" onclick="cambiarTab('reservas')">Reservas</button>
        <button class="tab-btn" data-tab="planes" onclick="cambiarTab('planes')">Planes</button>
        <button class="tab-btn" data-tab="alumnos" onclick="cambiarTab('alumnos')">Alumnos</button>
      </div>

      <div id="tab-content"></div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
